services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo_app
    env_file: .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCKER_SOCKET: /var/run/docker.sock
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-demo}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-demo-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-demo-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: sh -c "php artisan migrate --force && exec php-fpm"
    volumes:
      - .:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [demo]

  web:
    image: nginx:1.27-alpine
    container_name: demo_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [demo]

  frontend:
    profiles: [dev]
    image: node:22-alpine
    container_name: demo_frontend
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-demo-key}
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - frontend_node_modules:/var/www/html/node_modules
    networks: [demo]

  reverb:
    image: demo-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo_reverb
    env_file: .env
    environment:
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-demo}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-demo-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-demo-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_started
    networks: [demo]

  java:
    build: ./java
    container_name: demo_java
    expose:
      - "8081"
    networks: [demo]

  db:
    image: mysql:8.4
    container_name: demo_db
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [demo]

  redis:
    image: redis:7-alpine
    container_name: demo_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [demo]

  queue:
    image: demo-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo_queue
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-demo}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-demo-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-demo-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_started
    networks: [demo]

  jobs:
    image: demo-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo_jobs
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-demo}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-demo-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-demo-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
    networks: [demo]

volumes:
  app_public:
  db_data:
  frontend_node_modules:
  redis_data:

networks:
  demo:
    driver: bridge
